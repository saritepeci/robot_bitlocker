# =============================================================================
# Continuous Integration for the BitLocker + Smart Card test framework.
# =============================================================================
# WHY three separate jobs (lint / unit / robot) instead of one script?
#   * They run in PARALLEL and fail INDEPENDENTLY, so the PR check list tells you
#     exactly which gate broke (style vs. engine logic vs. end-to-end).
#   * The fast gates (lint, unit) give feedback in seconds; the slower Robot suite
#     runs alongside them, not after.
#
# WHY does everything run against the SIMULATED backend (ENV=ci)?
#   The framework drives a SimulatedSystemBackend, so the full login flow is
#   exercised deterministically with NO real hardware. Targeting a real encrypted
#   laptop would only change the `runs-on` runner and the environment file — see
#   docs/06_CICD.md. The jobs below intentionally reuse the same `make` targets
#   developers run locally, so "works on my machine" and "works in CI" converge.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege by default: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast static gate: enforces the conventions in docs/02_NAMING_CONVENTIONS.md.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (.robot static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dev dependencies
        run: make install-dev
      - name: Lint
        run: make lint

  # ---------------------------------------------------------------------------
  # Fast engine tests: pure-Python unit tests for the state machine, config, and
  # simulated backend. Milliseconds to run; catches logic regressions early.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: make install
      - name: Run unit tests
        run: make unit

  # ---------------------------------------------------------------------------
  # Full end-to-end Robot suite against the simulated SUT (ENV=ci). Always
  # publishes results/ (logs + diagnostics) so a red build is diagnosable without
  # a re-run. See docs/06_CICD.md §8 for the triage order.
  # ---------------------------------------------------------------------------
  robot:
    name: Robot tests (ENV=ci)
    runs-on: ubuntu-latest
    env:
      ROBOT_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: make install
      - name: Run Robot tests (unit + suite, xUnit output)
        run: make test-ci
      - name: Upload Robot results (logs, report, diagnostics, xUnit)
        if: always() # we want the artifacts PRECISELY when the tests failed
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
          if-no-files-found: warn
